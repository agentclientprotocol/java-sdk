# Interop agents and clients on the Rust SDK. The SDK path points at the peer checkout the runner
# prepares: integration-testing/.cache/peers/rust-sdk is a symlink to rust-sdk@<ref>, and
# CARGO_TARGET_DIR is set per ref so switching refs does not clobber builds.
#
# interop-agent / interop-client: the generated cells (steps.json; launch/*.sh, README "Contracts").
[package]
name = "acp-interop-rust"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Explicit paths: the repository .gitignore ignores every directory named "bin".
[[bin]]
name = "interop-agent"
path = "src/interop_agent.rs"

[[bin]]
name = "interop-client"
path = "src/interop_client.rs"

[dependencies]
# unstable_session_fork: session/fork, the one step of the unstable profile (design 4.7).
agent-client-protocol = { path = "../../.cache/peers/rust-sdk/src/agent-client-protocol", features = ["unstable_session_fork"] }
agent-client-protocol-http = { path = "../../.cache/peers/rust-sdk/src/agent-client-protocol-http", features = ["client", "server"] }
tokio = { version = "1.52", features = ["full"] }
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = "1"
serde_json = "1"
futures = "0.3"
