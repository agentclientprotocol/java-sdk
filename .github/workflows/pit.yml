name: Mutation testing (PIT)

# Runs the pit profile (acp-core's protocol core: the session classes, their shared
# request/response plumbing and the json package) and uploads the HTML report. Manual only:
# mutation testing is a measurement, not a gate on every change. The run fails if the
# mutation score drops below the profile's mutationThreshold.
on:
  workflow_dispatch:
    inputs:
      mutators:
        description: 'PIT mutator group'
        type: choice
        options:
          - DEFAULTS
          - STRONGER
        default: DEFAULTS

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT
        run: ./mvnw -B -Ppit -pl acp-core -am test -Dpit.mutators=${{ inputs.mutators }}

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pit-report-${{ inputs.mutators }}
          path: acp-core/target/pit-reports/
          retention-days: 14
