name: Real-agent smoke

# The Java stdio client from this checkout against published ACP agent CLIs (Gemini CLI, the
# Claude Agent ACP adapter, the Codex ACP adapter); see integration-testing/programs/smoke/.
# Manual dispatch only. It never gates push, pull request or release.
#
# Each agent job needs that agent's API key as a repository secret (GEMINI_API_KEY,
# ANTHROPIC_API_KEY, OPENAI_API_KEY). Adding secrets is an org-admin act. Until a secret exists
# its job prints "SKIPPED: secret X not configured" and succeeds, so nothing here needs editing
# once the keys are added.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run'
        type: choice
        options: [all, gemini, claude, codex]
        default: all
      keyless:
        description: 'With no secret, still run the keyless steps (initialize, session/new) instead of skipping'
        type: boolean
        default: false
  # Enable once the secrets exist (see integration-testing/programs/smoke/README.md):
  # schedule:
  #   - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  group: cross-sdk-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke (${{ matrix.agent }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional hardening: an environment named "smoke" with required reviewers would gate every
    # run on an approval and scope the secrets to it. Creating environments needs admin rights,
    # so it is not required here; to use it, create it, move the secrets into it, and uncomment.
    # environment: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: gemini
            secret: GEMINI_API_KEY
          - agent: claude
            secret: ANTHROPIC_API_KEY
          - agent: codex
            secret: OPENAI_API_KEY

    steps:
      - name: Decide whether to run
        id: gate
        env:
          HAS_SECRET: ${{ secrets[matrix.secret] != '' }}
          SELECTED: ${{ inputs.agent == '' || inputs.agent == 'all' || inputs.agent == matrix.agent }}
          KEYLESS: ${{ inputs.keyless == true }}
          AGENT: ${{ matrix.agent }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          if [ "$SELECTED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: $AGENT not selected" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_SECRET" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ "$KEYLESS" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "Secret $SECRET_NAME not configured: keyless steps only, the prompt step SKIPs" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: secret $SECRET_NAME not configured (an org admin adds it; see integration-testing/programs/smoke/README.md)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.run == 'true'

      - name: Set up JDK 17
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache the Maven distribution the wrapper uses
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Node 22: the Claude Agent ACP adapter declares node >=22.
      - name: Set up Node 22
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Smoke ${{ matrix.agent }}
        if: steps.gate.outputs.run == 'true'
        env:
          # Each job sees only its own agent's key.
          GEMINI_API_KEY: ${{ matrix.agent == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ matrix.agent == 'codex' && secrets.OPENAI_API_KEY || '' }}
          AGENT: ${{ matrix.agent }}
          AUTH: ${{ steps.gate.outputs.auth }}
        run: integration-testing/programs/smoke/run-smoke.sh "$AGENT" --auth "$AUTH"

      - name: Upload smoke logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.agent }}-logs
          path: integration-testing/logs/smoke/
          retention-days: 14
