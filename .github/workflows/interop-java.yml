name: Java interop cells

# The generated Java client <-> Java agent cells of integration-testing/ over stdio, Streamable
# HTTP and WebSocket, on every push to main and every pull request. They need only the JDK, so
# they are cheap; the per-peer cells run nightly in cross-sdk.yml. Also checks that the generated
# configs match steps.json, matrix.json and expectations/.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: interop-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache the Maven distribution the wrapper uses
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Set up JBang
        uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        with:
          version: '0.135.1'
          setup-java: 'false'

      - name: Check the generated configs are up to date
        working-directory: integration-testing
        run: jbang GenConfigs.java --check

      - name: Run the Java <-> Java cells
        env:
          RUN_LABEL: java-java
        run: integration-testing/scripts/run-all.sh --only 'x-java-java-*'

      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interop-java-logs
          path: integration-testing/logs/
          if-no-files-found: ignore
          retention-days: 7
