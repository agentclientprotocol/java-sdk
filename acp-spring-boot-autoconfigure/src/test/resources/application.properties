# Spring Security is on the test classpath for AcpAgentHttpSecurityTests and
# AcpAgentReactiveSecurityTests, which turn it back on
# (spring.autoconfigure.exclude=). Every other application here runs without it, as an
# application without Spring Security does.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.reactive.ReactiveWebSecurityAutoConfiguration
