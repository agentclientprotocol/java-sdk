greeting.prefix=Hello from Quarkus
# The packaged application (prod) is a stdio agent; @QuarkusTest serves the same agent over HTTP.
%test.quarkus.acp.agent.transport.type=http
# The client bean, in tests: a Quarkus ACP client of the same application's agent.
%test.quarkus.acp.client.transport.http.uri=http://localhost:${quarkus.http.test-port}/acp
