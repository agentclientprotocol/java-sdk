role = "both"
responsibility = "sdk"
statement = "`session/request_permission` messages MUST conform to the stable schema: `params` is a RequestPermissionRequest object with a ToolCallUpdate and PermissionOption entries, and a successful `result` is a RequestPermissionResponse object whose `outcome` is a RequestPermissionOutcome variant (`cancelled` or `selected` with `optionId`)."
pointers = ["/$defs/RequestPermissionRequest", "/$defs/RequestPermissionResponse", "/$defs/RequestPermissionOutcome", "/$defs/PermissionOption"]

[[derived]]
