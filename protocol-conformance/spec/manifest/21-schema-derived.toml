[[derived]]
id = "ACP-V1-SCHEMA-CONTENT-BLOCK-VARIANTS"
keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "Every ContentBlock MUST be exactly one of the stable variants discriminated by `type` (text, image, audio, resource, resource_link) with that variant's required members, and every ToolCallContent MUST be exactly one of content, diff or terminal."
pointers = ["/$defs/ContentBlock", "/$defs/TextContent", "/$defs/ImageContent", "/$defs/AudioContent", "/$defs/EmbeddedResource", "/$defs/ResourceLink", "/$defs/ToolCallContent", "/$defs/Diff"]

