pointers = ["/$defs/StopReason"]

[[derived]]
id = "ACP-V1-SCHEMA-ERROR-OBJECT"
keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "An error response MUST carry an Error object with integer `code` and string `message` (and optional `data`), and the predefined codes MUST keep their stable meanings: -32700 parse error, -32600 invalid request, -32601 method not found, -32602 invalid params, -32603 internal error, -32800 request cancelled, -32000 authentication required, -32002 resource not found."
pointers = ["/$defs/Error", "/$defs/ErrorCode"]

[[derived]]
id = "ACP-V1-SCHEMA-MCP-SERVER-VARIANTS"
keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "Every McpServer entry MUST be exactly one of the stable variants: stdio (no `type`, with `name`, `command`, `args`), http (`type: \"http\"` with `name`, `url`, `headers`) or sse (`type: \"sse\"` with `name`, `url`, `headers`)."
pointers = ["/$defs/McpServer", "/$defs/McpServerStdio", "/$defs/McpServerHttp", "/$defs/McpServerSse"]

[[derived]]
id = "ACP-V1-SCHEMA-AUTH-METHOD-VARIANTS"
keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "Every AuthMethod advertised in `authMethods` MUST be exactly one of the stable variants: agent (no `type` or `type: \"agent\"`, with `id` and `name`) or terminal (`type: \"terminal\"` with `id`, `name` and optional `args` and `env`)."
pointers = ["/$defs/AuthMethod", "/$defs/AuthMethodAgent", "/$defs/AuthMethodTerminal"]

[[derived]]
id = "ACP-V1-SCHEMA-EXTENSION-METHOD-NAMES"
keyword = "MUST"
