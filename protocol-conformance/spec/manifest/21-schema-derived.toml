keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "`session/update` is a notification whose `params` MUST be a SessionNotification object; its `update` MUST be exactly one SessionUpdate variant discriminated by `sessionUpdate` (user_message_chunk, agent_message_chunk, agent_thought_chunk, tool_call, tool_call_update, plan, available_commands_update, current_mode_update, config_option_update, session_info_update, usage_update), each carrying that variant's required members (for example `toolCallId` and `title` on tool_call, `entries` on plan, `used` and `size` on usage_update)."
pointers = ["/$defs/SessionNotification", "/$defs/SessionUpdate", "/$defs/ToolCall", "/$defs/ToolCallUpdate", "/$defs/Plan", "/$defs/UsageUpdate"]

