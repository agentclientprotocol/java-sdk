# Structural requirements derived from schema/v1/schema.json. The schema carries no RFC2119 keyword for these;
# each entry is a labelled derivation whose member lists are generated from the pinned bytes by the importer.
# The method names are the stable names in schema/v1/meta.json.

[[derived]]
id = "ACP-V1-SCHEMA-INITIALIZE-SHAPE"
keyword = "MUST"
role = "both"
responsibility = "sdk"
statement = "`initialize` messages MUST conform to the stable schema: the request `params` is an InitializeRequest object and a successful `result` is an InitializeResponse object, each carrying every required member with its declared type, including the nested ClientCapabilities and AgentCapabilities objects whose omitted or null members mean 'not advertised'."
pointers = ["/$defs/InitializeRequest", "/$defs/InitializeResponse", "/$defs/ClientCapabilities", "/$defs/AgentCapabilities"]

