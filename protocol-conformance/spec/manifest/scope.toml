[jsonrpc]
# ACP incorporates JSON-RPC 2.0 by reference (overview.mdx:10, :219, :227; extensibility.mdx:49).
url = "https://www.jsonrpc.org/specification"
retrieved = "2026-10-08"
sha256 = "8fe1edfdca511d309e712e47447457ea5159b728ec02071a84593aed692aefeb"
document_dates = "Origin Date: 2010-03-26 (based on the 2009-05-24 version); Updated: 2013-01-04"

[[exclusions]]
path = "docs/protocol/v1/draft/**"
reason = "Hidden draft group ('Draft: In Progress and May Change'); unstable, not part of the stable v1 contract."

[[exclusions]]
path = "docs/protocol/v2/**"
reason = "v2 is tagged Draft in the navigation; the Java SDK targets protocol version 1."

[[exclusions]]
path = "schema/v1/schema.unstable.json, schema/v1/meta.unstable.json"
reason = "Unstable schema; only the stable schema.json (identical to the SDK's vendored copy) is in scope."

[[exclusions]]
path = "docs/rfds/**"
reason = "RFDs (including the Streamable HTTP/WebSocket transport RFD) are proposals, not stable v1 clauses; the stable transports page still calls Streamable HTTP a draft proposal. The HTTP TCK remains supporting evidence only."

[[exclusions]]
path = "docs/libraries/**, docs/get-started/**"
reason = "Library and onboarding pages, not protocol specification."
